allowBuilds:
  esbuild: true
minimumReleaseAge: 4320
trustPolicy: no-downgrade
# 6.3.1 is a 2023 backport to the 6.x line, published after 7.5.x had already
# moved to provenance. Trust checks compare by publish date across major lines,
# so the backport reads as a downgrade. Dev-only, reached via @babel/core.
trustPolicyExclude:
  - semver@6.3.1
# browserslist pulls these data packages, which publish every few days, so a
# browserslist bump nearly always lands a version inside the release-age window.
minimumReleaseAgeExclude:
  - baseline-browser-mapping@2.11.35
  - electron-to-chromium@1.5.477
