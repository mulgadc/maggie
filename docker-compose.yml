name: maggie

services:
  dolt:
    build: .
    image: maggie:local
    command: ["dolt"]
    volumes:
      - dolt-data:/data
    expose:
      - "3307" # internal only — do NOT publish the DB port publicly
    restart: unless-stopped

  maggie:
    image: maggie:local
    depends_on:
      - dolt
    command: ["maggie"]
    environment:
      MAGGIE_ADDR: ":8088"
      DOLT_HOST: dolt
      DOLT_PORT: "3307"
    ports:
      # Serve on host port 80 so the team can reach it by hostname (no :port).
      # Override with MAGGIE_PORT for local dev if 80 is taken.
      # maggie has NO auth — keep this on a trusted LAN / front with a proxy.
      - "${MAGGIE_PORT:-80}:8088"
    restart: unless-stopped

  # Manual seed/refresh (one-shot): docker compose run --rm seed
  # Stop the dolt service first so the data dir is unlocked.
  seed:
    image: maggie:local
    command: ["seed"]
    profiles: ["tools"]
    volumes:
      - dolt-data:/data
      - ./snapshot:/snapshot:ro

volumes:
  dolt-data:
