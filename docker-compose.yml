name: maggie

services:
  dolt:
    build: .
    image: maggie:local
    command: ["dolt"]
    volumes:
      - dolt-data:/data
    expose:
      # Internal to the compose network by default (maggie reaches dolt:3307).
      # To serve remote bd clients, layer docker-compose.publish.yml (see below).
      - "3307"
    restart: unless-stopped

  maggie:
    image: maggie:local
    depends_on:
      - dolt
    command: ["maggie"]
    environment:
      MAGGIE_ADDR: ":8088"
      DOLT_HOST: dolt
      DOLT_PORT: "3307"
      # Auth for the dolt account maggie connects with (defaults: beads / none).
      # beads is the shared least-privilege account (read/write, no DROP); set
      # DOLT_USER=root to fall back to the full-privilege break-glass account.
      DOLT_USER: "${DOLT_USER:-beads}"
      DOLT_PASSWORD: "${DOLT_PASSWORD:-}"
      # Identity roster for edits, seeding the "acting as" picker. MAGGIE_ACTORS
      # is a comma-separated static list. Set GITHUB_ORG to source it from an org
      # instead; membership is private by default, so that needs a read:org
      # GITHUB_TOKEN. With neither set, users type their own name.
      MAGGIE_ACTORS: "${MAGGIE_ACTORS:-}"
      GITHUB_ORG: "${GITHUB_ORG:-}"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
    ports:
      # Serve on host port 80 so the team can reach it by hostname (no :port).
      # Override with MAGGIE_PORT for local dev if 80 is taken.
      # maggie has NO auth — keep this on a trusted LAN / front with a proxy.
      - "${MAGGIE_PORT:-80}:8088"
    restart: unless-stopped

  # Manual seed/refresh (one-shot): docker compose run --rm seed
  # Stop the dolt service first so the data dir is unlocked.
  seed:
    image: maggie:local
    command: ["seed"]
    profiles: ["tools"]
    environment:
      # Match maggie so the seeded account and its password line up.
      DOLT_USER: "${DOLT_USER:-beads}"
      DOLT_PASSWORD: "${DOLT_PASSWORD:-}"
    volumes:
      - dolt-data:/data
      - ./snapshot:/snapshot:ro

volumes:
  dolt-data:
