name: Bug report
description: Something is not working as it should.
labels: ["bug"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Web UI — table / list
        - Web UI — board (drag and drop)
        - Web UI — dependency graph
        - Issue detail / editing
        - API server
        - bd integration
        - Roster / identity picker
        - Docker / dolt stack
        - Configuration / deployment
        - Documentation
        - Other / not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Maggie version
      description: The commit SHA you are on, or the image tag if you are running the container.
      placeholder: commit abc1234, or ghcr.io/mulgadc/maggie:v1.0.0
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, what you expected instead, and how to reproduce it.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs and output
      description: Relevant log lines, error messages or command output.
      render: shell

  - type: textarea
    id: platform
    attributes:
      label: Platform
      description: Where you are running it, how you deployed it, and the `bd` version behind it.
      placeholder: |
        OS: Debian 13
        Arch: amd64
        Deployment: docker compose, or ./maggie binary
        Browser: Firefox 133
        bd: v1.0.5
