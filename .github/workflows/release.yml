name: Release

on:
  push:
    tags: ["v*"]
  # Run from the tag ref to re-publish an existing release.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: Publish Image
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Registry tags drop the leading v that the git tag carries, which is what
      # the ecosystem and this action both default to. latest=auto moves latest
      # only for a final release, never a prerelease.
      - name: Derive Image Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          flavor: latest=auto

      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: MAGGIE_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Catches the failure mode of building from a stale tree: the tag says one
      # thing and the binary inside says another.
      - name: Verify Stamped Version
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          GOT=$(docker run --rm --entrypoint maggie "$IMAGE" -version)
          echo "$GOT"
          [ "$GOT" = "maggie ${VERSION}" ] || {
            echo "expected 'maggie ${VERSION}'" >&2
            exit 1
          }

  release:
    name: Publish Release
    needs: image
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ needs.image.outputs.version }}
        with:
          generate_release_notes: true
          # A tag carrying a -rc/-beta suffix ships as a prerelease, matching
          # the latest tag the image job did not move.
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ```bash
            docker run --rm -p 8088:8088 \
              --user "$(id -u):$(id -g)" \
              -v "$PWD/.beads:/repo/.beads" \
              ${{ env.IMAGE }}:${{ env.VERSION }}
            ```
