name: Build and Test

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
          node-version-file: frontend/.nvmrc

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Lint
        run: pnpm lint

      - name: Run Tests with Coverage
        run: pnpm test:coverage

      - name: Build Frontend
        run: pnpm build

      - name: Check for generated route tree drift
        run: git diff --exit-code -- src/routeTree.gen.ts

  backend:
    name: Backend
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          # diff-coverage needs the previous commit to compute changed lines.
          fetch-depth: 2

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          cache-dependency-path: "go.sum"
          go-version-file: "go.mod"

      # package main go:embeds cmd/maggie/web, so it must exist for the Go code
      # to compile at all. The tests serve their own fs.FS and never read it, so
      # a placeholder keeps this job off Node entirely; the frontend job is what
      # proves the real bundle builds.
      - name: Stub the embedded frontend
        run: |
          mkdir -p cmd/maggie/web
          echo '<!doctype html>' > cmd/maggie/web/index.html

      - name: Build
        run: go build ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.0

      - name: Run Tests with Coverage
        run: make test-cover

      - name: Check Diff Coverage
        run: scripts/diff-coverage.sh coverage.out --base HEAD~1

      - name: Run Tests with Race Detector
        run: make test-race

      - name: Govulncheck
        run: make govulncheck
