version: 2
updates:
  - package-ecosystem: gomod
    target-branch: dev
    directory: /
    schedule:
      interval: weekly
      day: sunday
      timezone: Australia/Sydney
    cooldown:
      default-days: 3
    groups:
      go-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    target-branch: dev
    directory: /
    schedule:
      interval: weekly
      day: sunday
      timezone: Australia/Sydney
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    target-branch: dev
    directory: /frontend
    schedule:
      interval: weekly
      day: sunday
      timezone: Australia/Sydney
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
    groups:
      npm-dependencies:
        patterns:
          - "*"

  - package-ecosystem: docker
    target-branch: dev
    directory: /
    schedule:
      interval: weekly
      day: sunday
      timezone: Australia/Sydney
    cooldown:
      default-days: 3
    # Go 1.27.2 and Node 24.14.0 are deliberate; only their digests should move.
    ignore:
      - dependency-name: golang
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: node
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    groups:
      docker-images:
        patterns:
          - "*"
